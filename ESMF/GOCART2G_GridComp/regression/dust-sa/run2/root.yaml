---
mapl:
  setServices:
    sharedObj: libconfigurable_gridcomp

  geometry:
    esmf_geom:
      class: CubedSphere
      im_world: 12
    vertical_grid:
      class: model
      standard_name: air_pressure
      units: hPa
      num_levels: 181
      field_edge: PLE
      field_center: PE

  children:
    DataDU:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-du.yaml
    FakeGOCART:
      dso: libconfigurable_gridcomp.so
      config_file: fake-gocart.yaml

  connections:
