---
cap:
  name: CAP
  restart: cap_restart.yaml

  clock:
    dt: PT20M
    start: 2000-04-14T21:00:00
    stop: 2999-03-02T21:00:00
    segment_duration: PT20M

  run_extdata: false
  run_history: false
  root_name: Root

  mapl:

    setServices:
      sharedObj: libMAPL.cap

    children:
      Root:
        dso: libconfigurable_gridcomp.so
        config_file: root.yaml

  checkpointing:
    enabled: true
    final: true
    path: checkpoints

esmf:
  logKindFlag: ESMF_LOGKIND_MULTI_ON_ERROR
  logAppendFlag: false

mapl:
  model_petcount: 6
