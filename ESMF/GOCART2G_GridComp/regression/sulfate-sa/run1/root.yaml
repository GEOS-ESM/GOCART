      class: CubedSphere
      im_world: 12
    vertical_grid:
      grid_type: model
      fields: {pressure: PLE}
      num_levels: 181

  children:
    DataForSU:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-for-su.yaml

    FakeGOCART:
      dso: libconfigurable_gridcomp.so
      config_file: fake-gocart.yaml

  connections:
