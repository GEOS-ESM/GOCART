---
# Optics parameters
aerosol_monochromatic_optics_wavelength_in_nm_from_LUT: [470, 550, 670, 870]

wavelengths_for_profile_aop_in_nm: [470, 870]  # must be included in LUT
wavelengths_for_vertically_integrated_aop_in_nm: 550  # must be included in LUT

aerosol_photolysis_wavelength_in_nm_from_LUT: [200, 300, 400, 500, 600]
n_phase_function_moments_photolysis: 0

# KNOWN LIMITATION: activating CA fails at SetServices. MAPL3's
# MAPL_GridCompAddChild asserts is_valid_name() on every child name, which
# rejects the dotted CA instance names (CA.oc, CA.bc, CA.br) inherited from
# the MAPL2-era GOCART2G design ("Child name <CA.oc> does not conform to
# GEOS standards."). This directory is kept for structural parity with
# gocart+seasalt+dust+sulfate+nitrate, not because the case is expected to
# pass. Full details in ../../CA2G_GridComp/mapl3-porting-notes.md
# ("Run-testing update").
ACTIVE_INSTANCES:
  DU: [DU]  # [DU.data]
  SS: [SS]  # [SS.data]
  SU: [SU]  # [SU.data]
  CA: [CA.oc, CA.bc, CA.br]
  NI: [NI]  # [NI.data]

PASSIVE_INSTANCES:
  DU: []
  SS: []
  SU: []
  CA: []
  NI: []

mapl:

  setServices:
    sharedObj: libGOCART2G_GridComp
    userRoutine: gocart2g_setservices_

  misc:
    activate_all_exports: true
    checkpoint:
      export: true
      import: true
