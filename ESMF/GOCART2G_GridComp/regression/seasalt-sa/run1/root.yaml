---
mapl:
  setServices:
    sharedObj: libconfigurable_gridcomp

  geometry:
    esmf_geom:
      class: CubedSphere
      im_world: 12
    vertical_grid:
      class: model
      standard_name: air_pressure
      units: hPa
      num_levels: 181
      field_edge: PLE
      field_center: PE

  children:
    DataSS:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-ss.yaml

    FakeGOCART:
      dso: libconfigurable_gridcomp.so
      config_file: fake-gocart.yaml

  connections:
    - src_name: FROCEAN
      src_comp: DataSS
      src_intent: internal
      dst_name: FROCEAN
      dst_comp: FakeGOCART

    - src_name: FRACI
      src_comp: DataSS
      src_intent: internal
      dst_name: FRACI
      dst_comp: FakeGOCART

    - src_name: U10M
      src_comp: DataSS
      src_intent: internal
      dst_name: U10M
      dst_comp: FakeGOCART

    - src_name: V10M
      src_comp: DataSS
      src_intent: internal
      dst_name: V10M
      dst_comp: FakeGOCART

    - src_name: USTAR
      src_comp: DataSS
      src_intent: internal
      dst_name: USTAR
      dst_comp: FakeGOCART

    - src_name: TS
      src_comp: DataSS
      src_intent: internal
      dst_name: TS
      dst_comp: FakeGOCART

    - src_name: DELP
      src_comp: DataSS
      src_intent: internal
      dst_name: DELP
      dst_comp: FakeGOCART
