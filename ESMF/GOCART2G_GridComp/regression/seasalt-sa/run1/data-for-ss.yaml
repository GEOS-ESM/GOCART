mapl:

  setServices:
    sharedObj: libconfigurable_gridcomp

  misc:
    restart:
      internal: true

  states:
    internal:
      FROCEAN:
        standard_name: "fraction_of_ocean"
        units: "1"
        vertical_dim_spec: "n"
      FRACI:
        standard_name: "ice_covered_fraction_of_tile"
        units: "1"
        vertical_dim_spec: "n"
      U10M:
        standard_name: "10-meter_eastward_wind"
        units: "m s-1"
        vertical_dim_spec: "n"
      V10M:
        standard_name: "10-meter_northward_wind"
        units: "m s-1"
        vertical_dim_spec: "n"
      USTAR:
        standard_name: "surface_velocity_scale"
        units: "m s-1"
        vertical_dim_spec: "n"
      TS:
        standard_name: "surface skin temperature"
        units: "K"
        vertical_dim_spec: "n"
      DELP:
        standard_name: "pressure_thickness"
        units: "Pa"
        vertical_dim_spec: "c"

  connections:
    - src_comp: <self>
      src_name: FROCEAN
      src_intent: internal
      dst_comp: <self>
      dst_name: FROCEAN
      dst_intent: export

    - src_comp: <self>
      src_name: FRACI
      src_intent: internal
      dst_comp: <self>
      dst_name: FRACI
      dst_intent: export

    - src_comp: <self>
      src_name: U10M
      src_intent: internal
      dst_comp: <self>
      dst_name: U10M
      dst_intent: export

    - src_comp: <self>
      src_name: V10M
      src_intent: internal
      dst_comp: <self>
      dst_name: V10M
      dst_intent: export

    - src_comp: <self>
      src_name: USTAR
      src_intent: internal
      dst_comp: <self>
      dst_name: USTAR
      dst_intent: export

    - src_comp: <self>
      src_name: TS
      src_intent: internal
      dst_comp: <self>
      dst_name: TS
      dst_intent: export

    - src_comp: <self>
      src_name: DELP
      src_intent: internal
      dst_comp: <self>
      dst_name: DELP
      dst_intent: export
