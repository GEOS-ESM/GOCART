---
# Optics parameters
aerosol_monochromatic_optics_wavelength_in_nm_from_LUT: [470, 550, 670, 870]

wavelengths_for_profile_aop_in_nm: [470, 870]  # must be included in LUT
wavelengths_for_vertically_integrated_aop_in_nm: 550  # must be included in LUT

aerosol_photolysis_wavelength_in_nm_from_LUT: [200, 300, 400, 500, 600]
n_phase_function_moments_photolysis: 0

ACTIVE_INSTANCES:
  DU: [DU]  # [DU.data]
  SS: [SS]  # [SS.data]
  SU: [SU]  # [SU.data]
  CA: []  # [CA.oc, CA.bc, CA.br] code ported, but blocked: dotted child
          # names fail MAPL3's is_valid_name() check (see
          # ../../CA2G_GridComp/mapl3-porting-notes.md)
  NI: [NI]  # [NI.data]

PASSIVE_INSTANCES:
  DU: []
  SS: []
  SU: []
  CA: []
  NI: []

mapl:

  setServices:
    sharedObj: libGOCART2G_GridComp
    userRoutine: gocart2g_setservices_

  misc:
    activate_all_exports: true
    checkpoint:
      export: true
      import: true
