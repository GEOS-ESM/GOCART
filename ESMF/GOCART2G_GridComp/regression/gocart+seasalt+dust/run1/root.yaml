---
mapl:
  setServices:
    sharedObj: libconfigurable_gridcomp

  geometry:
    esmf_geom:
      class: CubedSphere
      im_world: 12
    vertical_grid:
      grid_type: model
      fields: {pressure: PLE}
      num_levels: 181

  children:
    DataForDU:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-for-du.yaml
      run_phases:
        - run

    DataForSS:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-for-ss.yaml
      run_phases:
        - run

    DataForGOCART2G:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-for-gocart2g.yaml
      run_phases:
        - run

    GOCART2G:
      dso: libGOCART2G_GridComp.so
      setservices: gocart2g_setservices_
      config_file: GOCART2G_GridComp.yaml
      run_phases:
        - Run1

  connections:
    # DataForGOCART2G
    - src_name: AIRDENS
      src_comp: DataForGOCART2G
      src_intent: internal
      dst_name: AIRDENS
      dst_comp: GOCART2G

    - src_name: DELP
      src_comp: DataForGOCART2G
      src_intent: internal
      dst_name: DELP
      dst_comp: GOCART2G

    # From DataForDU
    - src_name: DU_SRC
      src_comp: DataForDU
      src_intent: internal
      dst_name: DU_SRC
      dst_comp: GOCART2G

    - src_name: WET1
      src_comp: DataForDU
      src_intent: internal
      dst_name: WET1
      dst_comp: GOCART2G

    - src_name: LWI
      src_comp: DataForDU
      src_intent: internal
      dst_name: LWI
      dst_comp: GOCART2G

    # From DataForSS
    - src_name: FROCEAN
      src_comp: DataForSS
      src_intent: internal
      dst_name: FROCEAN
      dst_comp: GOCART2G

    - src_name: FRACI
      src_comp: DataForSS
      src_intent: internal
      dst_name: FRACI
      dst_comp: GOCART2G

    - src_name: U10M
      src_comp: DataForSS
      src_intent: internal
      dst_name: U10M
      dst_comp: GOCART2G

    - src_name: V10M
      src_comp: DataForSS
      src_intent: internal
      dst_name: V10M
      dst_comp: GOCART2G

    - src_name: USTAR
      src_comp: DataForSS
      src_intent: internal
      dst_name: USTAR
      dst_comp: GOCART2G

    - src_name: TS
      src_comp: DataForSS
      src_intent: internal
      dst_name: TS
      dst_comp: GOCART2G
