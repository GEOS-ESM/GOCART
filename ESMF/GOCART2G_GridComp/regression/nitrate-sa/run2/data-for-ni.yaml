mapl:

  setServices:
    sharedObj: libconfigurable_gridcomp

  misc:
    restart:
      internal: true

  states:
    internal:
      DU:
        standard_name: "Dust Mixing Ratio all bins"
        units: "kg kg-1"
        vertical_dim_spec: "c"
        ungridded_dims:
          # dim_units must match DuSsStub_GridCompMod.F90's MAPL_UngriddedDim
          # units="1" for its connected DU/SS imports, since the
          # UNGRIDDED_DIMS aspect's equality check (used to validate the
          # connection) compares name/units/extent.
          - {dim_name: nbins, dim_units: "1", extent: 5}
      SS:
        standard_name: "Sea Salt Mixing Ratio all bins"
        units: "kg kg-1"
        vertical_dim_spec: "c"
        ungridded_dims:
          - {dim_name: nbins, dim_units: "1", extent: 5}
      LWI:
        standard_name: "land-ocean-ice_mask"
        units: "1"
        vertical_dim_spec: "n"
      TROPP:
        standard_name: "tropopause_pressure_based_on_blended_estimate"
        units: "Pa"
        vertical_dim_spec: "n"
      USTAR:
        standard_name: "surface_velocity_scale"
        units: "m s-1"
        vertical_dim_spec: "n"
      ZPBL:
        standard_name: "planetary_boundary_layer_height"
        units: "m"
        vertical_dim_spec: "n"
      SH:
        standard_name: "sensible_heat_flux_from_turbulence"
        units: "w m-2"
        vertical_dim_spec: "n"
      Z0H:
        standard_name: "surface_roughness_for_heat"
        units: "m"
        vertical_dim_spec: "n"
      CN_PRCP:
        standard_name: "surface_conv._rain_flux_needed_by_land"
        units: "kg/m^2/s"
        vertical_dim_spec: "n"
      NCN_PRCP:
        standard_name: "Non-convective precipitation"
        units: "kg/m^2/s"
        vertical_dim_spec: "n"
      AIRDENS:
        standard_name: "moist_air_density"
        units: "kg/m^3"
        vertical_dim_spec: "c"
      DELP:
        standard_name: "pressure_thickness"
        units: "Pa"
        vertical_dim_spec: "c"
      T:
        standard_name: "air_temperature"
        units: "K"
        vertical_dim_spec: "c"
      RH2:
        standard_name: "Rel_Hum_after_moist"
        units: "1"
        vertical_dim_spec: "c"
      U:
        standard_name: "eastward_wind"
        units: "m s-1"
        vertical_dim_spec: "c"
      V:
        standard_name: "northward_wind"
        units: "m s-1"
        vertical_dim_spec: "c"
      ZLE:
        standard_name: "geopotential_height"
        units: "m"
        vertical_dim_spec: "e"
      PLE:
        standard_name: "air_pressure"
        units: "Pa"
        vertical_dim_spec: "e"
      PFL_LSAN:
        standard_name: "3D_flux_of_liquid_nonconvective_precipitation"
        units: "kg/m2/s"
        vertical_dim_spec: "e"
      PFI_LSAN:
        standard_name: "3D_flux_of_ice_nonconvective_precipitation"
        units: "kg/m2/s"
        vertical_dim_spec: "e"
      NITRATE_HNO3:
        standard_name: "nitrate hno3 offline field"
        units: "mol mol-1"
        vertical_dim_spec: "c"
      SO4:
        standard_name: "Sulfate Mixing Ratio"
        units: "kg kg-1"
        vertical_dim_spec: "c"

  connections:
    - src_comp: <self>
      src_name: DU
      src_intent: internal
      dst_comp: <self>
      dst_name: DU
      dst_intent: export

    - src_comp: <self>
      src_name: SS
      src_intent: internal
      dst_comp: <self>
      dst_name: SS
      dst_intent: export

    - src_comp: <self>
