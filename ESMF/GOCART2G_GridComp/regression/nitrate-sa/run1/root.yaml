---
mapl:

  setServices:
    sharedObj: libconfigurable_gridcomp

  geometry:
    esmf_geom:
      class: CubedSphere
      im_world: 12
    vertical_grid:
      grid_type: model
      fields: {pressure: PLE}
      num_levels: 181

  children:
    DataForNI:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-for-ni.yaml

    # Minimal stand-in for DU2G/SS2G: takes in real DU/SS values (connected
    # below to DataForNI's internal DU/SS, the same import netcdf4 file
    # DataForNI's other fields are read from) and re-exports them carrying
    # the 'radius'/'fnum' ESMF Info attributes that NI2G's Initialize
    # unconditionally reads off its DU/SS imports. See
    # ../../DuSsStub_GridComp/DuSsStub_GridCompMod.F90. Must be initialized
    # after DataForNI but before FakeGOCART (children are initialized in
    # declaration order) so the Info is attached to the DU/SS fields before
    # NI2G's Initialize reads it off the connected import fields.
    DuSsStub:
      dso: libDuSsStub_GridComp.so
      setservices: setservices_
      config_file: dusstub.yaml

    FakeGOCART:
      dso: libconfigurable_gridcomp.so
      config_file: fake-gocart.yaml

  connections:
    - src_name: DU
      src_comp: DataForNI
      src_intent: internal
      dst_name: DU
      dst_comp: DuSsStub
    - src_name: SS
      src_comp: DataForNI
      src_intent: internal
      dst_name: SS
      dst_comp: DuSsStub
    - src_name: DU
      src_comp: DuSsStub
      src_intent: export
      dst_name: DU
      dst_comp: FakeGOCART
    - src_name: SS
      src_comp: DuSsStub
      src_intent: export
      dst_name: SS
      dst_comp: FakeGOCART
    - src_name: DELP
      src_comp: DataForNI
      src_intent: internal
      dst_name: DELP
      dst_comp: FakeGOCART
    - src_name: EMI_NH3_AG
      src_comp: DataForNI
      src_intent: internal
      dst_name: EMI_NH3_AG
      dst_comp: FakeGOCART
    - src_name: EMI_NH3_BB
      src_comp: DataForNI
      src_intent: internal
      dst_name: EMI_NH3_BB
      dst_comp: FakeGOCART
    - src_name: EMI_NH3_EN
      src_comp: DataForNI
      src_intent: internal
      dst_name: EMI_NH3_EN
      dst_comp: FakeGOCART
    - src_name: EMI_NH3_IN
      src_comp: DataForNI
      src_intent: internal
      dst_name: EMI_NH3_IN
      dst_comp: FakeGOCART
    - src_name: EMI_NH3_OC
      src_comp: DataForNI
      src_intent: internal
      dst_name: EMI_NH3_OC
      dst_comp: FakeGOCART
    - src_name: EMI_NH3_RE
      src_comp: DataForNI
      src_intent: internal
      dst_name: EMI_NH3_RE
      dst_comp: FakeGOCART
    - src_name: EMI_NH3_TR
      src_comp: DataForNI
      src_intent: internal
      dst_name: EMI_NH3_TR
      dst_comp: FakeGOCART
