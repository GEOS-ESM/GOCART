version: 2.1

# Anchors in case we need to override the defaults from the orb
#baselibs_version: &baselibs_version v8.33.0
#bcs_version: &bcs_version v12.0.0

orbs:
  ci: geos-esm/circleci-tools@5

workflows:
  build-and-test:
    jobs:
      # Build GEOSgcm
      - ci/build:
          name: build-GEOSgcm-on-<< matrix.compiler >>
          context:
            - docker-hub-creds
          matrix:
            parameters:
              compiler: [gfortran, ifx]
          #baselibs_version: *baselibs_version
          repo: GEOSgcm
          checkout_fixture: true
          fixture_branch: release/MAPL-v3
          mepodevelop: false
          run_regression_tests: true
          ctest_options: "-L REGRESSION"
          persist_workspace: false # Needs to be true to run fv3/gcm experiment, costs extra
          # The regression tests need a larger machine to run in a reasonable time
          resource_class: xlarge
